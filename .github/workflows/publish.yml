name: Publish to npm

on:
  push:
    branches: [main]
    paths:
      # Only release when shipped code actually changes.
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'
  workflow_dispatch:
    inputs:
      release-type:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch

jobs:
  publish:
    runs-on: ubuntu-latest
    # Skip commits made by this workflow, or the version bump push
    # would trigger another run in an endless loop.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        run: npm version ${{ inputs.release-type || 'patch' }} -m "chore: release v%s [skip ci]"

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Push version commit and tag
        run: git push --follow-tags
